          Host                10.230.85.64
          Port                9207
          HTTP_User           redacted
          HTTP_Passwd         redacted
          Logstash_Format     True
          Logstash_Prefix     redis-testing
          Match               *
          Suppress_Type_Name  On
 
    parsersconf: |
      [PARSER]
          Name        parser_json
          Format      json
          Time_Key    started_at
          Time_Format %s
