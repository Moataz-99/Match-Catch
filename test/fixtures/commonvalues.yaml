  #### Fluentbit #####

  
  fluentbitConfigmap:
    fluentbit: |
      [SERVICE]
          Flush        5
          Daemon       Off
          Log_Level    debug
          Parsers_File parsers.conf
          HTTP_Server  On
          HTTP_Listen  0.0.0.0
          HTTP_Port    2020

      [INPUT]
