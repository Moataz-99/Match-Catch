<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src __CSP_SOURCE__ data:; style-src __CSP_SOURCE__ 'unsafe-inline'; script-src 'nonce-__NONCE__';" />
<title>Config Match &amp; Catch</title>
<!--LIBS-->
<style>
:root{
  --bg:#0d1117; --bg2:#131a23; --panel:#161d27; --panel2:#1c2531; --line:#26303d;
  --line2:#33404f; --tx:#e6edf3; --tx2:#9aa8b8; --tx3:#6b7a8c;
  --acc:#e60000; --acc2:#ff4d4d;
  --ok:#3fb950; --warn:#d29922; --bad:#f85149; --info:#58a6ff; --purple:#bc8cff; --orange:#ff9f43;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--tx);font-size:13.5px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit}
a{color:#79b8ff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#2b3644;border-radius:5px;border:2px solid var(--bg)}
.app{display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:linear-gradient(180deg,#161d27,#121820);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.dot{width:11px;height:11px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px rgba(230,0,0,.16)}
.brand small{display:block;font-weight:400;color:var(--tx3);font-size:11px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;background:var(--panel2);
  border:1px solid var(--line2);color:var(--tx2);font-size:11.5px;white-space:nowrap}
.pill b{color:var(--tx);font-weight:600}
.pill.ok{border-color:rgba(63,185,80,.4);color:#8fe0a0}
.pill.bad{border-color:rgba(248,81,73,.45);color:#ffa7a2}
.tabs{display:flex;gap:2px;padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--line);
  position:sticky;top:51px;z-index:39;overflow-x:auto}
.tab{padding:9px 13px;border:none;background:none;color:var(--tx2);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--tx);background:rgba(255,255,255,.03)}
.tab.on{color:var(--tx);border-bottom-color:var(--acc);font-weight:600}
.tab .cnt{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:0 6px;font-size:11px;color:var(--tx2)}
.tab.on .cnt{background:rgba(230,0,0,.15);border-color:rgba(230,0,0,.4);color:#ff9d9d}
.main{flex:1;padding:16px 18px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.card h3{margin:0;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.card h3 .sub{font-weight:400;color:var(--tx3);font-size:11.5px}
.pad{padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.muted{color:var(--tx3)}
.hl{background:rgba(230,0,0,.22);border-radius:2px}
.hint{font-size:11.5px;color:var(--tx3);line-height:1.6}
.btn{background:var(--panel2);border:1px solid var(--line2);color:var(--tx);padding:6px 11px;border-radius:7px;display:inline-flex;align-items:center;gap:6px;transition:.12s}
.btn:hover{background:#26313f;border-color:#425264}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.pri:hover{background:#ff1a1a}
.btn.ok{background:rgba(63,185,80,.16);border-color:rgba(63,185,80,.5);color:#8fe0a0}
.btn.sm{padding:3px 8px;font-size:11.5px;border-radius:6px}
.btn.gh{background:transparent}
.inp{background:#0e141c;border:1px solid var(--line2);color:var(--tx);padding:6px 10px;border-radius:7px;outline:none;width:100%}
.inp:focus{border-color:#4d6076}
textarea.inp{resize:vertical;font-family:var(--mono);font-size:11.5px;line-height:1.5}
.mono{font-family:var(--mono)}
label.fld{display:block;margin-bottom:9px}
label.fld>span{display:block;font-size:11px;color:var(--tx3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.badge{display:inline-block;padding:1px 7px;border-radius:5px;font-size:10.5px;font-weight:600;letter-spacing:.3px;white-space:nowrap;border:1px solid transparent}
.b-ok{background:rgba(63,185,80,.14);color:#5fd975;border-color:rgba(63,185,80,.3)}
.b-bad{background:rgba(248,81,73,.14);color:#ff8a83;border-color:rgba(248,81,73,.32)}
.b-warn{background:rgba(210,153,34,.15);color:#e2b13f;border-color:rgba(210,153,34,.32)}
.b-info{background:rgba(88,166,255,.14);color:#79b8ff;border-color:rgba(88,166,255,.3)}
.b-pur{background:rgba(188,140,255,.14);color:#c9a4ff;border-color:rgba(188,140,255,.3)}
.b-gray{background:var(--panel2);color:var(--tx2);border-color:var(--line2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:11px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 13px;position:relative;overflow:hidden;cursor:pointer;transition:.12s}
.tile:hover{border-color:var(--line2);transform:translateY(-1px)}
.tile .n{font-size:25px;font-weight:700;line-height:1.15}
.tile .l{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.tile .bar{position:absolute;left:0;top:0;bottom:0;width:3px}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:2;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid #1c2530;vertical-align:top}
tbody tr:hover{background:rgba(255,255,255,.028)}
tr.sel{background:rgba(230,0,0,.08)!important}
.k{font-family:var(--mono);font-size:11.5px;word-break:break-all;color:#cbd6e2}
.v{font-family:var(--mono);font-size:11.5px;word-break:break-all;color:var(--tx2);max-width:340px}
.v.diff{color:#ffb3ae}
.empty{padding:36px 20px;text-align:center;color:var(--tx3)}
.empty .big{font-size:32px;margin-bottom:8px;opacity:.5}
.drop{border:1.5px dashed var(--line2);border-radius:10px;padding:18px;text-align:center;color:var(--tx3);background:#0f151d;transition:.15s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--acc);background:rgba(230,0,0,.05);color:var(--tx2)}
.drop b{display:block;color:var(--tx);font-size:13px;margin-bottom:3px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--tx2);font-size:12px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--acc);width:14px;height:14px}
.split{display:grid;grid-template-columns:1fr 380px;gap:14px;align-items:start}
@media(max-width:1150px){.split{grid-template-columns:1fr}}
.side{position:sticky;top:100px}
.sug{border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:8px;background:var(--panel2)}
.score{height:4px;background:#0e141c;border-radius:3px;overflow:hidden;margin-top:6px}
.score i{display:block;height:100%;background:linear-gradient(90deg,var(--warn),var(--ok))}
.kv{display:flex;gap:8px;font-size:11.5px;margin-top:3px}
.kv .kk{color:var(--tx3);min-width:72px;flex-shrink:0}
.kv .vv{font-family:var(--mono);color:var(--tx2);word-break:break-all}
code.inline{background:#0e141c;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:11.5px}
pre.out{background:#0b1017;border:1px solid var(--line);border-radius:8px;padding:11px;overflow:auto;max-height:340px;font-family:var(--mono);font-size:11.5px;line-height:1.55;color:#c9d4e0;margin:0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2a36;border:1px solid var(--line2);padding:9px 16px;border-radius:8px;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:80vw}
.editcell{display:flex;gap:5px;align-items:flex-start}
.editcell .pen{opacity:0;background:none;border:none;color:var(--tx3);padding:0 2px;font-size:12px}
tr:hover .editcell .pen{opacity:1}
.editcell .pen:hover{color:var(--acc2)}
.fixbtns{display:flex;gap:3px;white-space:nowrap;flex-wrap:wrap}
.diffline{font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;word-break:break-all;padding:1px 6px;border-radius:3px}
.diffline.add{background:rgba(63,185,80,.12);color:#8fe0a0}
.diffline.del{background:rgba(248,81,73,.12);color:#ff9d97}
.savebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:11px 14px;border-top:1px solid var(--line)}
.wscard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px;transition:.12s}
.wscard:hover{border-color:var(--line2)}
.wscard.on{border-color:var(--acc);box-shadow:0 0 0 1px rgba(230,0,0,.35)}
.wscard .nm{font-weight:600;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.repo{font-family:var(--mono);font-size:11px;color:var(--tx3);word-break:break-all;margin-bottom:2px}
.rev{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:12px;overflow:hidden}
.rev .body{display:grid;grid-template-columns:1fr 1fr}
@media(max-width:820px){.rev .body{grid-template-columns:1fr}}
.rev .half{padding:12px 14px}
.rev .half+.half{border-left:1px solid var(--line)}
.rev .foot{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
.why{font-size:11.5px;color:var(--tx2);line-height:1.65}
.why ul{margin:4px 0 0;padding-left:16px}
.stepnum{width:20px;height:20px;border-radius:50%;background:var(--acc);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.banner{border:1px solid rgba(210,153,34,.4);background:rgba(210,153,34,.08);color:#e8c26b;border-radius:9px;padding:10px 13px;margin-bottom:14px;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;line-height:1.55}
.banner.info{border-color:rgba(88,166,255,.35);background:rgba(88,166,255,.07);color:#9fcaff}
.banner.bad{border-color:rgba(248,81,73,.4);background:rgba(248,81,73,.08);color:#ffa7a2}
.banner.good{border-color:rgba(63,185,80,.4);background:rgba(63,185,80,.08);color:#8fe0a0}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.envs{display:flex;gap:4px;flex-wrap:wrap}
.envbtn{padding:4px 11px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);color:var(--tx2);font-size:12px}
.envbtn.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.envbtn:disabled{opacity:.6;cursor:default}
.keylink{cursor:pointer;border-bottom:1px dotted var(--tx3)}
.keylink:hover{color:var(--info);border-bottom-color:var(--info)}
.mono{font-family:var(--mono);font-size:12px;word-break:break-all}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:12px;width:100%;max-width:620px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal.wide{max-width:900px}
.modal-h{padding:14px 18px;font-weight:700;font-size:15px;border-bottom:1px solid var(--line)}
.modal-b{padding:14px 18px;color:var(--tx2);line-height:1.55;max-height:65vh;overflow:auto}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.warnbtn{background:#9a6a00;border-color:#b07a00;color:#fff}
.issues{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.issue{display:flex;gap:9px;padding:8px 10px;border-radius:8px;font-size:12.5px;line-height:1.45;align-items:flex-start}
.issue .ic{flex-shrink:0}
.lv-err{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.4);color:#ffb3ae}
.lv-warn{background:rgba(210,153,34,.1);border:1px solid rgba(210,153,34,.4);color:#ecc66e}
.lv-info{background:rgba(88,166,255,.07);border:1px solid rgba(88,166,255,.3);color:#a9cfff}
.hero{background:linear-gradient(135deg,#1a2230,#151b25);border:1px solid var(--line2);border-radius:14px;padding:20px;margin-bottom:16px}
.hero h2{margin:0 0 4px;font-size:18px}
.searchbox{width:100%;padding:12px 14px;font-size:15px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);color:var(--tx);outline:none}
.searchbox:focus{border-color:var(--info)}
.results{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.res{display:grid;grid-template-columns:110px 1fr 1fr auto;gap:10px;padding:8px 12px;border-top:1px solid var(--line);align-items:center;cursor:pointer;font-size:12.5px}
.res:first-child{border-top:none}
.res:hover{background:var(--panel2)}
.res .kk2{font-family:var(--mono);color:var(--tx)}
.res .vv2{font-family:var(--mono);color:var(--tx3);font-size:11.5px;word-break:break-all}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.stat:hover{border-color:var(--line2)}
.stat .n{font-size:28px;font-weight:700}
.stat .l{color:var(--tx3);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.home2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.att{display:flex;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-size:12.5px}
.att:first-child{border-top:none}
.att .what{flex:1;min-width:0}
.att .what .k{font-family:var(--mono);color:var(--tx);word-break:break-all}
.envcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--panel)}
.envcard.on{border-color:var(--acc)}
.envcard .nm{font-weight:600;display:flex;gap:8px;align-items:center}
.envdot{width:9px;height:9px;border-radius:50%;display:inline-block}
.grid-env{width:100%;border-collapse:collapse}
.grid-env td,.grid-env th{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top;font-size:12.5px;text-align:left}
.missing{color:var(--orange);font-style:italic}
.qa{display:flex;flex-direction:column;gap:8px}
.qa .btn{justify-content:flex-start;text-align:left}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{padding:4px 10px;border-radius:14px;border:1px solid var(--line2);background:var(--panel2);color:var(--tx2);font-size:12px;cursor:pointer}
.chip.on{background:var(--info);border-color:var(--info);color:#06121f;font-weight:600}
.vrow{cursor:pointer}
.vrow:hover td{background:rgba(255,255,255,.02)}
.vrow.open td{background:rgba(88,166,255,.06)}
.envtable input.inp{width:100%}
.linkbtn{background:none;border:none;color:var(--info);padding:0;cursor:pointer;font-size:12px}
.tabsep{width:1px;background:var(--line2);margin:8px 6px}
@media (max-width:900px){.home2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.res{grid-template-columns:90px 1fr}}
.inp.bad{border-color:rgba(248,81,73,.7)!important}
.cnt.hot{background:var(--warn);color:#1a1200}
.envsel{border-color:rgba(230,0,0,.5)}
</style>
</head>
<body>
<div id="root"></div>
<!--APP-->
</body>
</html>
